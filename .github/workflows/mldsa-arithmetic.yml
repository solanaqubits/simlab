name: ML-DSA public source replay
on:
  push:
    paths: ['studies/mldsa44_arithmetic/**', 'studies/mldsa44_stage15/**', 'tests/test_mldsa_public_package.py', 'tests/test_mldsa_stage15_public_package.py', '.github/workflows/mldsa-arithmetic.yml']
  pull_request:
    paths: ['studies/mldsa44_arithmetic/**', 'studies/mldsa44_stage15/**', 'tests/test_mldsa_public_package.py', 'tests/test_mldsa_stage15_public_package.py', '.github/workflows/mldsa-arithmetic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout public revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 5
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Replay selected source patch
        run: python3 -B studies/mldsa44_arithmetic/check_package.py
        timeout-minutes: 1
      - name: Reject modified package inputs
        run: python3 -B -m unittest tests.test_mldsa_public_package -v
        timeout-minutes: 1
      - name: Check catalog
        run: python3 -B scripts/check_catalog.py
        timeout-minutes: 1
      - name: Replay frozen Stage 15 selected sources
        run: python3 -B studies/mldsa44_stage15/check_package.py
        timeout-minutes: 1
      - name: Check Stage 15 tamper controls
        run: python3 -B -m unittest tests.test_mldsa_stage15_public_package -v
        timeout-minutes: 1
